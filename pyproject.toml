[project]
name = "urx"
version = "0.1.0"
description = "Upgrade Risk Extraction: evidence-grounded upgrade risk models from public documentation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
  "packaging>=24",
  "jsonschema>=4.21",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
urx = "urx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["online: needs network or LLM access"]
